<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <radialGradient id="bioGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#150505" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050202" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bioGlow)"/>
  
  <!-- Spencer Mansion Window / Bars -->
  <rect x="220" y="40" width="160" height="240" rx="80" fill="#0a0202" stroke="#7f1d1d" stroke-width="3"/>
  <line x1="300" y1="40" x2="300" y2="280" stroke="#7f1d1d" stroke-width="2"/>
  <line x1="220" y1="160" x2="380" y2="160" stroke="#7f1d1d" stroke-width="2"/>
  
  <!-- Biohazard Hazard Symbol -->
  <g transform="translate(300, 160) scale(0.7)" fill="none" stroke="#dc2626" stroke-width="5">
    <circle cx="0" cy="0" r="18" fill="#dc2626"/>
    <circle cx="0" cy="-35" r="30"/>
    <circle cx="-30" cy="20" r="30"/>
    <circle cx="30" cy="20" r="30"/>
  </g>
  
  <!-- Blood Splatters & Slits -->
  <path d="M120 180 Q140 240 135 280 M135 230 Q160 250 170 290" stroke="#991b1b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="138" cy="295" r="4" fill="#7f1d1d"/>
  <circle cx="172" cy="305" r="3" fill="#7f1d1d"/>
  
  <!-- R.P.D. Classified Badge -->
  <rect x="40" y="40" width="130" height="40" fill="#050505" stroke="#991b1b" stroke-width="1.5"/>
  <text x="50" y="65" font-family="Impact, sans-serif" font-size="20" fill="#dc2626" letter-spacing="3">R.P.D.</text>
  <text x="105" y="63" font-family="monospace" font-size="9" fill="#999">SPECIAL TACTICS</text>
  <text x="50" y="75" font-family="monospace" font-size="8" fill="#dc2626">RACCOON POLICE DEPT</text>
  
  <text x="40" y="335" font-family="'Times New Roman', serif" font-weight="bold" font-size="30" fill="#ef4444" letter-spacing="4">RESIDENT EVIL</text>
  <text x="40" y="358" font-family="monospace" font-size="11" fill="#999">SURVIVAL HORROR // BIOHAZARD // TENSION &amp; RESOURCE SCARCITY</text>
</svg>