  <text x="40" y="65" font-family="'Pricedown', Impact, sans-serif" font-size="34" fill="#ffffff">GRAND THEFT AUTO</text>
  <text x="390" y="70" font-family="Times New Roman, serif" font-weight="900" font-size="44" fill="#22c55e">V</text>
  
  <text x="40" y="335" font-family="monospace" font-size="12" font-weight="bold" fill="#f43f5e">LOS SANTOS // SAN ANDREAS</text>
  <text x="40" y="356" font-family="monospace" font-size="11" fill="#aaa">OPEN-WORLD FREEDOM • CINEMATIC HEIST CHAOS • MULTI-CHARACTER</text>
