      <stop offset="0%" stop-color="#180b22"/>
      <stop offset="45%" stop-color="#3b1d38"/>
      <stop offset="75%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#gta5Grad)"/>
  
  <!-- Los Santos Downtown skyline at sunset -->
