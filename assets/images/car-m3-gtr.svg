<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bmwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b24"/>
      <stop offset="50%" stop-color="#0f131a"/>
      <stop offset="100%" stop-color="#06080b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bmwGrad)"/>
  
  <!-- Twin Kidney Grilles with silver slats -->
  <g transform="translate(230, 180)">
    <rect x="0" y="0" width="60" height="50" rx="10" fill="#000" stroke="#94a3b8" stroke-width="3"/>
    <line x1="15" y1="5" x2="15" y2="45" stroke="#64748b" stroke-width="2"/>
    <line x1="30" y1="5" x2="30" y2="45" stroke="#64748b" stroke-width="2"/>
    <line x1="45" y1="5" x2="45" y2="45" stroke="#64748b" stroke-width="2"/>
    
    <rect x="80" y="0" width="60" height="50" rx="10" fill="#000" stroke="#94a3b8" stroke-width="3"/>
    <line x1="95" y1="5" x2="95" y2="45" stroke="#64748b" stroke-width="2"/>
    <line x1="110" y1="5" x2="110" y2="45" stroke="#64748b" stroke-width="2"/>
    <line x1="125" y1="5" x2="125" y2="45" stroke="#64748b" stroke-width="2"/>
  </g>
  
  <!-- Aggressive Angel Eyes / Xenon Projectors -->
  <circle cx="160" cy="195" r="22" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="160" cy="195" r="8" fill="#38bdf8"/>
  <circle cx="440" cy="195" r="22" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="440" cy="195" r="8" fill="#38bdf8"/>
  
  <!-- M Motorsport Stripes (Light Blue, Dark Blue, Red) -->
  <polygon points="40,290 80,290 60,350 20,350" fill="#00a3e0"/>
  <polygon points="80,290 120,290 100,350 60,350" fill="#002f6c"/>
  <polygon points="120,290 160,290 140,350 100,350" fill="#e50914"/>
  
  <text x="40" y="55" font-family="Impact, sans-serif" font-size="28" fill="#ffffff" letter-spacing="2">BMW M3 GTR (E46)</text>
  <text x="310" y="55" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">P60B40 4.0L V8 // 444 HP</text>
  <text x="40" y="80" font-family="monospace" font-size="11" fill="#888">STRAIGHT-CUT GEARS • CARBON AERO • STREET RACING LEGEND</text>
</svg>