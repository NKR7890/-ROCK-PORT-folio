<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="midnightPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180424"/>
      <stop offset="50%" stop-color="#0b0816"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#midnightPurple)"/>
  
  <!-- Daikoku Parking Line & Rain Wet Reflections -->
  <rect x="0" y="270" width="600" height="110" fill="#08080c"/>
  <line x1="80" y1="360" x2="520" y2="360" stroke="#fff" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Twin Iconic Afterburner Round Taillights Glowing Red -->
  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="28" fill="#7f1d1d" stroke="#ef4444" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="#ef4444"/>
    <circle cx="55" cy="0" r="22" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
    <circle cx="55" cy="0" r="11" fill="#ef4444"/>
  </g>
  <g transform="translate(380, 200)">
    <circle cx="-55" cy="0" r="22" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
    <circle cx="-55" cy="0" r="11" fill="#ef4444"/>
    <circle cx="0" cy="0" r="28" fill="#7f1d1d" stroke="#ef4444" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="#ef4444"/>
  </g>
  
  <!-- Rear Wing & Decklid Profile -->
  <path d="M100 130 H500 L490 150 H110 Z" fill="#0d0814" stroke="#4c1d95" stroke-width="1.5"/>
  <path d="M150 150 L160 200 M450 150 L440 200" stroke="#333" stroke-width="4"/>
  <path d="M120 200 C150 180 250 175 300 175 C350 175 450 180 480 200 L510 260 H90 Z" fill="#140722" stroke="#6b21a8" stroke-width="1"/>
  
  <!-- Big Bore Titanium Exhaust Tip with Heat Burn (Blue / Purple) -->
  <ellipse cx="440" cy="275" rx="16" ry="12" fill="#000" stroke="#3b82f6" stroke-width="4"/>
  
  <text x="40" y="55" font-family="Impact, sans-serif" font-size="28" fill="#ffffff" letter-spacing="2">SKYLINE GT-R (R34)</text>
  <text x="310" y="55" font-family="monospace" font-size="14" font-weight="bold" fill="#a855f7">V-SPEC II // RB26DETT</text>
  <text x="40" y="80" font-family="monospace" font-size="11" fill="#888">MIDNIGHT PURPLE III • ATTESA E-TS PRO AWD • TWIN TURBO</text>
  
  <rect x="40" y="325" width="160" height="26" fill="#1e102e" stroke="#a855f7" stroke-width="1"/>
  <text x="48" y="342" font-family="monospace" font-size="11" fill="#c084fc">CATEGORY: JDM LEGENDS</text>
</svg>