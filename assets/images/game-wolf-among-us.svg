<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="wolfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19062b"/>
      <stop offset="50%" stop-color="#2d0b4e"/>
      <stop offset="100%" stop-color="#090212"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#wolfGrad)"/>
  
  <!-- Comic Noir Halftone Rain -->
  <g stroke="#a855f7" stroke-width="1" opacity="0.25">
    <line x1="20" y1="0" x2="0" y2="380"/> <line x1="120" y1="0" x2="100" y2="380"/>
    <line x1="220" y1="0" x2="200" y2="380"/> <line x1="320" y1="0" x2="300" y2="380"/>
    <line x1="420" y1="0" x2="400" y2="380"/> <line x1="520" y1="0" x2="500" y2="380"/>
  </g>
  
  <!-- Bigby Wolf Silhouette in heavy Noir Graphic Novel shadows -->
  <path d="M250 140 C230 140 210 160 200 190 C180 220 170 250 150 290 H350 C330 250 320 220 300 190 C290 160 270 140 250 140 Z" fill="#090212" stroke="#a855f7" stroke-width="2"/>
  <!-- Glowing Wolf Eyes -->
  <ellipse cx="235" cy="185" rx="6" ry="2.5" fill="#eab308"/>
  <ellipse cx="265" cy="185" rx="6" ry="2.5" fill="#eab308"/>
  <!-- Cigarette smoke wisps -->
  <circle cx="250" cy="225" r="3" fill="#ef4444"/>
  <path d="M250 225 Q240 200 245 180 Q255 160 240 140 Q230 120 240 100" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Fabletown Neon Sign -->
  <rect x="420" y="50" width="140" height="40" fill="#090212" stroke="#ec4899" stroke-width="2"/>
  <text x="430" y="76" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ec4899" letter-spacing="2">TRIP TRAP</text>
  
  <text x="40" y="70" font-family="Impact, sans-serif" font-size="34" fill="#ffffff" letter-spacing="1">THE WOLF AMONG US</text>
  <text x="40" y="335" font-family="monospace" font-size="12" font-weight="bold" fill="#c084fc">VERTIGO // FABLETOWN NOIR</text>
  <text x="40" y="356" font-family="monospace" font-size="11" fill="#999">HARD-BOILED DETECTIVE • BIGBY WOLF • GRAPHIC NOVEL ART</text>
</svg>